{% extends "base.html" %}
{% load static %}
{% block content %}

<h1>{{ test.title }}</h1>

<form id="quizForm">
  <div class="question-list">
    {% for question in test.questions.all %}
      <div class="question" data-correct="{{ question.correct_answer }}" data-question="{{ forloop.counter }}">
        <p>{{ question.question_text }}</p>
        <ul class="answers-list">
          <li><label><input type="radio" name="q{{ forloop.counter }}" value="1"> {{ question.answer1 }}</label></li>
          <li><label><input type="radio" name="q{{ forloop.counter }}" value="2"> {{ question.answer2 }}</label></li>
          <li><label><input type="radio" name="q{{ forloop.counter }}" value="3"> {{ question.answer3 }}</label></li>
        </ul>
      </div>
    {% endfor %}
  </div>

  <button type="submit" class="submit-btn">Проверить</button>
</form>

<p id="quizResult"></p>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        console.log("Скрипт загружен напрямую в шаблоне");
    });
</script>

{% endblock %}
